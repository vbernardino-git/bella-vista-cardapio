<style>
:root {
  --bg: #0F1117;
  --surface: #1A1D27;
  --surface2: #22263A;
  --border: #2E3347;
  --text: #E8EAF0;
  --muted: #6B7280;
  --gold: #F59E0B;
  --green: #10B981;
  --red: #EF4444;
  --blue: #3B82F6;
  --purple: #8B5CF6;
  --orange: #F97316;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* TOPBAR */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.85rem 1.5rem;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 50;
}

/* STATS */
.stats-bar {
  display: flex;
  gap: 1rem;
  padding: 1rem 1.5rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}

/* BOARD */
.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  flex: 1;
  background: var(--border);

  /* 🔥 CORREÇÃO */
  min-height: 0;
}

/* COLUMN */
.column {
  background: var(--bg);
  display: flex;
  flex-direction: column;

  /* 🔥 CORREÇÃO */
  min-height: 0;
}

/* HEADER */
.col-header {
  padding: 1rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

/* SCROLL AREA */
.col-orders {
  flex: 1;
  overflow-y: auto;

  /* 🔥 ESSENCIAL */
  min-height: 0;

  /* iOS smooth scroll */
  -webkit-overflow-scrolling: touch;

  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

/* CARD */
.order-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

/* MOBILE */
@media (max-width: 700px) {
  .board {
    grid-template-columns: 1fr;
  }

  .column {
    max-height: 60vh;
  }
}
</style>
