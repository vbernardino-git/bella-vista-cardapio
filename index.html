<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante Bella Vista — Cardápio</title>

<style>
  :root {
    --cream: #F9F5EE;
    --dark: #1A1209;
    --gold: #C8962A;
    --gold-light: #E8B84B;
    --rust: #A0412A;
    --text: #3D2B0F;
    --muted: #8B7355;
    --card-bg: #FFFDF7;
    --border: #E8DEC8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--dark);
    color: var(--cream);
    text-align: center;
    padding: 2.5rem 1rem 2rem;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 120%, rgba(200,150,42,0.25) 0%, transparent 70%);
  }

  .header-ornament {
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 7vw, 3.2rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    position: relative;
  }

  header p {
    color: rgba(249,245,238,0.6);
    margin-top: 0.5rem;
    font-size: 0.9rem;
    font-weight: 300;
  }

  /* NAME INPUT */
  .name-banner {
    background: var(--gold);
    padding: 0.85rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .name-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
  }

  .name-banner label {
    color: var(--dark);
    font-weight: 500;
    font-size: 0.9rem;
    white-space: nowrap;
  }

  .name-banner input {
    flex: 1;
    padding: 0.55rem 1rem;
    border: none;
    border-radius: 6px;
    background: rgba(255,255,255,0.9);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--dark);
    outline: none;
    transition: box-shadow 0.2s;
  }

  .name-banner input:focus {
    box-shadow: 0 0 0 3px rgba(26,18,9,0.2);
  }

  /* CATEGORIES NAV */
  .categories {
    display: flex;
    gap: 0.5rem;
    padding: 1.25rem 1rem;
    overflow-x: auto;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    scrollbar-width: none;
  }

  .categories::-webkit-scrollbar { display: none; }

  .cat-btn {
    padding: 0.5rem 1.1rem;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .cat-btn.active, .cat-btn:hover {
    background: var(--dark);
    border-color: var(--dark);
    color: var(--cream);
  }

  /* MENU SECTIONS */
  .menu-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 1.5rem 1rem 8rem;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--dark);
    margin: 2rem 0 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--gold);
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .section-title .emoji { font-size: 1.3rem; }

  /* ITEM CARDS */
  .items-grid {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .item-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    gap: 1rem;
    padding: 1rem;
    transition: box-shadow 0.2s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }

  .item-card:hover {
    box-shadow: 0 4px 20px rgba(26,18,9,0.08);
    transform: translateY(-1px);
  }

  .item-img {
    width: 90px;
    height: 90px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    background: linear-gradient(135deg, #E8DEC8, #C8B895);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    overflow: hidden;
  }

  .item-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
    display: block;
  }

  .item-img .emoji-fallback {
    font-size: 2.2rem;
    line-height: 1;
  }

  .item-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
  }

  .item-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    color: var(--dark);
    font-weight: 600;
  }

  .item-desc {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.25rem;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .item-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.5rem;
  }

  .item-price {
    font-weight: 700;
    font-size: 1rem;
    color: var(--rust);
  }

  .add-btn {
    background: var(--dark);
    color: var(--cream);
    border: none;
    border-radius: 8px;
    padding: 0.4rem 0.9rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .add-btn:hover { background: var(--gold); color: var(--dark); }
  .add-btn:active { transform: scale(0.95); }

  /* QTY CONTROL */
  .qty-control {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--cream);
    border-radius: 8px;
    padding: 0.25rem;
    border: 1.5px solid var(--border);
  }

  .qty-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: var(--dark);
    color: var(--cream);
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .qty-btn:hover { background: var(--gold); color: var(--dark); }

  .qty-num {
    font-weight: 700;
    font-size: 0.95rem;
    min-width: 20px;
    text-align: center;
  }

  /* BADGE */
  .badge {
    position: absolute;
    top: 0.6rem;
    right: 0.6rem;
    background: var(--gold);
    color: var(--dark);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
  }

  /* CART BUTTON */
  .cart-fab {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--dark);
    color: var(--cream);
    border: none;
    border-radius: 100px;
    padding: 1rem 2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 8px 32px rgba(26,18,9,0.35);
    transition: transform 0.2s, background 0.2s;
    z-index: 100;
    min-width: 260px;
    justify-content: center;
  }

  .cart-fab:hover { background: var(--gold); color: var(--dark); transform: translateX(-50%) translateY(-2px); }
  .cart-fab.hidden { display: none; }

  .cart-count {
    background: var(--gold);
    color: var(--dark);
    border-radius: 100px;
    padding: 0.1rem 0.6rem;
    font-size: 0.85rem;
    font-weight: 800;
  }

  /* CART MODAL */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,18,9,0.6);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }

  .overlay.open { display: flex; }

  .cart-modal {
    background: var(--cream);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp 0.3s ease;
  }


  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .cart-header {
    padding: 1.5rem 1.5rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .cart-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
  }

  .close-btn {
    background: var(--border);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .close-btn:hover { background: var(--dark); color: var(--cream); }

  .cart-items {
    overflow-y: auto;
    flex: 1;
    padding: 1rem 1.5rem;
    /* Limit height so footer/button always stays visible */
    max-height: 45vh;
  }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border);
  }

  .cart-item-name {
    flex: 1;
    font-weight: 500;
    font-size: 0.95rem;
  }

  .cart-item-qty {
    color: var(--muted);
    font-size: 0.85rem;
    min-width: 30px;
    text-align: center;
  }

  .cart-item-price {
    font-weight: 700;
    color: var(--rust);
    min-width: 70px;
    text-align: right;
    font-size: 0.95rem;
  }

  .cart-remove {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    padding: 0.25rem;
    border-radius: 4px;
    transition: color 0.2s;
  }

  .cart-remove:hover { color: var(--rust); }

  .cart-footer {
    padding: 1.25rem 1.5rem;
    border-top: 2px solid var(--border);
    background: var(--card-bg);
    flex-shrink: 0; /* always visible, never pushed off screen */
  }

  .cart-total {
    display: flex;
    justify-content: space-between;
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 1rem;
  }

  .cart-total .total-val { color: var(--rust); font-size: 1.3rem; }

  .confirm-btn {
    width: 100%;
    background: var(--gold);
    color: var(--dark);
    border: none;
    border-radius: 12px;
    padding: 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.02em;
  }

  .confirm-btn:hover { background: var(--gold-light); }
  .confirm-btn:active { transform: scale(0.98); }
  .confirm-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  /* SUCCESS */
  .success-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
    text-align: center;
    gap: 1rem;
  }

  .success-screen.show { display: flex; }

  .success-icon {
    width: 72px;
    height: 72px;
    background: #2D6A4F;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    animation: pop 0.4s ease;
  }

  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  .success-screen h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--dark);
  }

  .success-screen p { color: var(--muted); font-size: 0.9rem; }

  .order-num {
    font-size: 2rem;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: 0.05em;
  }

  /* EMPTY CART */
  .empty-cart {
    padding: 2rem;
    text-align: center;
    color: var(--muted);
  }

  .empty-cart .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

  @media (max-width: 500px) {
    .item-img { width: 75px; height: 75px; }
    .item-img .emoji-fallback { font-size: 1.8rem; }
    .item-name { font-size: 0.95rem; }
  }

  /* OBSERVATION */
  .obs-wrap {
    padding: 0.75rem 1.5rem 0;
  }

  .obs-wrap label {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 500;
    display: block;
    margin-bottom: 0.4rem;
  }

  .obs-wrap textarea {
    width: 100%;
    padding: 0.6rem 0.9rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    background: var(--cream);
    color: var(--text);
    resize: none;
    outline: none;
    transition: border-color 0.2s;
  }

  .obs-wrap textarea:focus { border-color: var(--gold); }

  .loading-spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid rgba(26,18,9,0.3);
    border-top-color: var(--dark);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  .toast {
    position: fixed;
    top: 1rem;
    right: 1rem;
    background: var(--dark);
    color: var(--cream);
    padding: 0.75rem 1.25rem;
    border-radius: 10px;
    font-size: 0.9rem;
    z-index: 999;
    transform: translateY(-80px);
    opacity: 0;
    transition: all 0.3s;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  @media (max-width: 500px) {
    .item-img { width: 75px; height: 75px; font-size: 1.8rem; }
    .item-name { font-size: 0.95rem; }
  }
</style>

    </div>
    <div class="success-screen" id="successScreen">

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  },
  {
    id: 12, category: 'bebidas',
    name: 'Suco Natural',
    desc: 'Laranja, limão ou maracujá (300ml)',
    price: 14.90, emoji: '🍋'
  },

  {

    price: 34.90, emoji: '☕'

];

// ============================================================
// STATE
// ============================================================
let cart = {};
let currentCategory = 'all';
let orderCounter = Math.floor(Math.random() * 90) + 10; // demo

// ============================================================
// RENDER MENU
// ============================================================
function renderMenu() {
  const container = document.getElementById('menuContainer');
  const categories = {
    entradas:    { label: 'Entradas', emoji: '🥗' },
    massas:      { label: 'Massas & Risotos', emoji: '🍝' },
    carnes:      { label: 'Carnes', emoji: '🥩' },
    bebidas:     { label: 'Bebidas', emoji: '🍷' },
    sobremesas:  { label: 'Sobremesas', emoji: '🍮' },
  };

  container.innerHTML = '';

  Object.entries(categories).forEach(([key, meta]) => {
    const items = menu.filter(i => i.category === key &&
      (currentCategory === 'all' || currentCategory === key));
    if (!items.length) return;

    const section = document.createElement('section');
    section.id = `sec-${key}`;
    section.innerHTML = `
      <h2 class="section-title">
        <span class="emoji">${meta.emoji}</span> ${meta.label}
      </h2>
      <div class="items-grid">
        ${items.map(item => renderItem(item)).join('')}
      </div>
    `;
    container.appendChild(section);
  });
}

function renderItem(item) {
  const inCart = cart[item.id];
  const price = item.price.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  return `
    <div class="item-card" id="card-${item.id}">
      ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
      <div class="item-img">
        ${item.imageUrl
          ? `<img src="${item.imageUrl}" alt="${item.name}" onerror="this.parentElement.innerHTML='<span class=\\'emoji-fallback\\'>${item.emoji}</span>'">`
          : `<span class="emoji-fallback">${item.emoji}</span>`
        }
      </div>
      <div class="item-info">
        <div>
          <div class="item-name">${item.name}</div>
          <div class="item-desc">${item.desc}</div>
        </div>
        <div class="item-footer">
          <span class="item-price">${price}</span>
          ${inCart ? `
            <div class="qty-control">
              <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
              <span class="qty-num">${inCart}</span>
              <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          ` : `
            <button class="add-btn" onclick="addToCart(${item.id})">
              + Adicionar
            </button>
          `}
        </div>
      </div>
    </div>
  `;
}

// ============================================================
// CART LOGIC
// ============================================================
function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  updateCartUI();
  showToast(`${menu.find(i=>i.id===id).name} adicionado!`);
}

function changeQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  updateCartUI();
}

function updateCartUI() {
  const total = Object.values(cart).reduce((a, b) => a + b, 0);
  const fab = document.getElementById('cartFab');
  const count = document.getElementById('cartCount');

  count.textContent = total;
  fab.classList.toggle('hidden', total === 0);

  // Re-render affected cards only
  menu.forEach(item => {
    const card = document.getElementById(`card-${item.id}`);
    if (card) {
      const footer = card.querySelector('.item-footer');
      const price = item.price.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      const inCart = cart[item.id];
      footer.innerHTML = `
        <span class="item-price">${price}</span>
        ${inCart ? `
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
            <span class="qty-num">${inCart}</span>
            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
          </div>
        ` : `
          <button class="add-btn" onclick="addToCart(${item.id})">+ Adicionar</button>
        `}
      `;
    }
  });
}

function filterCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderMenu();
  if (cat !== 'all') {
    const sec = document.getElementById(`sec-${cat}`);
    if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

// ============================================================
// CART MODAL
// ============================================================
function openCart() {
  document.getElementById('overlay').classList.add('open');
  renderCartItems();
}

function closeCart() {
  document.getElementById('overlay').classList.remove('open');
}

function closeOnOverlay(e) {
  if (e.target === document.getElementById('overlay')) closeCart();
}

function renderCartItems() {
  const container = document.getElementById('cartItems');
  const items = Object.entries(cart);

  if (!items.length) {
    container.innerHTML = `<div class="empty-cart"><div class="icon">🛒</div><p>Carrinho vazio</p></div>`;
    document.getElementById('cartTotal').textContent = 'R$ 0,00';
    return;
  }

  let total = 0;
  container.innerHTML = items.map(([id, qty]) => {
    const item = menu.find(i => i.id == id);
    const sub = item.price * qty;
    total += sub;
    return `
      <div class="cart-item">
        <span style="font-size:1.2rem">${item.emoji}</span>
        <span class="cart-item-name">${item.name}</span>
        <span class="cart-item-qty">×${qty}</span>
        <span class="cart-item-price">${sub.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</span>
        <button class="cart-remove" onclick="removeFromCart(${id})">✕</button>
      </div>
    `;
  }).join('');

  document.getElementById('cartTotal').textContent =
    total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function removeFromCart(id) {
  delete cart[id];
  updateCartUI();
  renderCartItems();
}

// ============================================================
// SUBMIT ORDER
// ============================================================
async function submitOrder() {
  const name = document.getElementById('clientName').value.trim();
  const table = document.getElementById('tableNum').value.trim();
  const obs = document.getElementById('observations').value.trim();

  if (!name) {
    showToast('⚠️ Digite seu nome antes de enviar!');
    closeCart();
    document.getElementById('clientName').focus();
    return;
  }

  if (!Object.keys(cart).length) return;

  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span> Enviando...';

  const items = Object.entries(cart).map(([id, qty]) => {
    const item = menu.find(i => i.id == id);
    return { id: parseInt(id), name: item.name, qty, price: item.price };
  });

  const total = items.reduce((sum, i) => sum + i.price * i.qty, 0);
  orderCounter++;

  const order = {
    order_number: orderCounter,
    client_name: name,
    table_number: table ? parseInt(table) : null,
    items,
    observations: obs,
    total,
    status: 'pending',
    created_at: new Date().toISOString()
  };

  try {
    if (useSupabase) {
      await sbInsert(order);
    } else {
      // DEMO MODE
      await new Promise(r => setTimeout(r, 1200));
      console.log('📦 PEDIDO (modo demo):', order);
    }

    // Sucesso
    document.getElementById('orderNum').textContent = `#${String(orderCounter).padStart(3,'0')}`;
    registerPushClient(String(orderCounter));
    document.getElementById('cartContent').style.display = 'none';
    document.getElementById('successScreen').classList.add('show');

  } catch (err) {
    console.error(err);
    showToast('❌ Erro ao enviar. Tente novamente.');
    btn.disabled = false;
    btn.innerHTML = 'Enviar Pedido para a Cozinha →';
  }
}

function resetOrder() {
  cart = {};
  document.getElementById('observations').value = '';
  document.getElementById('cartContent').style.display = 'block';
  document.getElementById('successScreen').classList.remove('show');
  document.getElementById('confirmBtn').disabled = false;
  document.getElementById('confirmBtn').innerHTML = 'Enviar Pedido para a Cozinha →';
  updateCartUI();
  renderMenu();
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

let pushOrderId = null;

function urlB64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function registerPushClient(orderId) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  pushOrderId = orderId;

  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;

    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY)
    });

    // Save subscription to DB linking to this order
    await fetch(SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/push_subscriptions', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        order_id: orderId,
        role: 'client',
        subscription: sub.toJSON(),
        created_at: new Date().toISOString()
      })
    });

    console.log('Push subscription saved for order', orderId);
  } catch(e) {
    console.warn('Push registration failed:', e.message);
  }
}
