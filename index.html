<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Santa Fé — Lanchonete & Restaurante | Cardápio Vila Olímpia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1A1209">
<style>
  :root{
    --cream:#F9F5EE; --cream-2:#F3ECDF; --dark:#1A1209; --dark-2:#2A1D0E;
    --gold:#C8962A; --gold-light:#E8B84B; --rust:#A0412A; --text:#3D2B0F;
    --muted:#8B7355; --card-bg:#FFFDF7; --border:#E8DEC8; --border-2:#DED2B6;
    --green:#2D6A4F; --blue:#2C5F8A;
    --shadow-sm:0 2px 8px rgba(26,18,9,.06);
    --shadow:0 8px 28px rgba(26,18,9,.10);
    --shadow-lg:0 16px 44px rgba(26,18,9,.22);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:var(--cream);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  img{max-width:100%;}
  ::selection{background:var(--gold);color:var(--dark);}

  /* ---------- HEADER ---------- */
  header{
    background:linear-gradient(160deg,var(--dark) 0%,var(--dark-2) 100%);
    color:var(--cream); padding:2rem 1.25rem 1.5rem; position:relative; overflow:hidden;
    text-align:center;
  }
  header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 130%,rgba(200,150,42,.28) 0%,transparent 65%);}
  header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .brand-mark{position:relative;font-size:.7rem;letter-spacing:.32em;color:var(--gold-light);text-transform:uppercase;margin-bottom:.5rem;font-weight:600;}
  header h1{position:relative;font-family:'Playfair Display',serif;font-size:clamp(2.2rem,9vw,3.4rem);font-weight:700;line-height:1;}
  header h1 .dot{color:var(--gold);}
  .info-row{position:relative;display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;}
  .info-pill{background:rgba(249,245,238,.10);border:1px solid rgba(232,184,75,.25);color:rgba(249,245,238,.9);
    font-size:.72rem;font-weight:500;padding:.32rem .7rem;border-radius:100px;backdrop-filter:blur(4px);}
  .info-pill b{color:var(--gold-light);font-weight:600;}

  /* ---------- SEARCH BAR (sticky) ---------- */
  .searchbar{position:sticky;top:0;z-index:40;background:var(--cream);padding:.85rem 1rem;border-bottom:1px solid var(--border);
    box-shadow:0 4px 16px rgba(26,18,9,.04);}
  .search-inner{max-width:820px;margin:0 auto;position:relative;display:flex;align-items:center;}
  .search-inner .lupa{position:absolute;left:1rem;font-size:1rem;opacity:.55;pointer-events:none;}
  #searchInput{width:100%;padding:.85rem 2.6rem .85rem 2.7rem;border:1.5px solid var(--border-2);border-radius:100px;
    background:var(--card-bg);font-family:inherit;font-size:.95rem;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;}
  #searchInput::placeholder{color:var(--muted);}
  #searchInput:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(200,150,42,.14);}
  .search-clear{position:absolute;right:.6rem;background:var(--border);border:none;width:30px;height:30px;border-radius:50%;
    font-size:.9rem;cursor:pointer;color:var(--dark);display:none;align-items:center;justify-content:center;transition:background .2s;}
  .search-clear:hover{background:var(--gold);}
  .search-clear.show{display:flex;}

  /* ---------- APP CONTAINER ---------- */
  main{max-width:820px;margin:0 auto;padding:1.25rem 1rem 7.5rem;}
  .block-title{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--dark);margin:.5rem 0 1rem;display:flex;align-items:center;gap:.6rem;}
  .block-title .line{flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:2px;}

  /* ---------- HOME: DESTAQUES ---------- */
  .featured-scroll{display:flex;gap:.75rem;overflow-x:auto;padding:.25rem .25rem 1rem;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -.25rem;}
  .featured-scroll::-webkit-scrollbar{display:none;}
  .feat-card{scroll-snap-align:start;flex:0 0 auto;width:158px;background:var(--card-bg);border:1px solid var(--border);border-radius:16px;
    padding:.9rem;display:flex;flex-direction:column;gap:.5rem;box-shadow:var(--shadow-sm);position:relative;transition:transform .18s,box-shadow .18s;}
  .feat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
  .feat-emoji{font-size:2.4rem;line-height:1;filter:drop-shadow(0 3px 5px rgba(26,18,9,.12));}
  .feat-name{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:600;color:var(--dark);line-height:1.15;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.2em;}
  .feat-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
  .feat-price{font-weight:700;color:var(--rust);font-size:.95rem;}

  /* ---------- HOME: CATEGORY GRID ---------- */
  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;}
  @media(min-width:620px){.cat-grid{grid-template-columns:repeat(3,1fr);}}
  .cat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:18px;padding:1.15rem 1rem;cursor:pointer;
    display:flex;flex-direction:column;gap:.35rem;box-shadow:var(--shadow-sm);transition:transform .18s,box-shadow .18s,border-color .18s;text-align:left;position:relative;overflow:hidden;}
  .cat-card::after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(200,150,42,.10),transparent 70%);}
  .cat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--gold);}
  .cat-card:active{transform:scale(.98);}
  .cat-ic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--cream-2),#EADFC5);display:flex;align-items:center;justify-content:center;font-size:1.7rem;margin-bottom:.35rem;}
  .cat-label{font-family:'Playfair Display',serif;font-size:1.02rem;font-weight:600;color:var(--dark);line-height:1.15;}
  .cat-count{font-size:.75rem;color:var(--muted);font-weight:500;}

  /* ---------- CATEGORY VIEW ---------- */
  .subbar{position:sticky;top:64px;z-index:30;background:var(--cream);padding:.6rem 0 .3rem;margin:-.25rem -1rem .5rem;padding-left:1rem;padding-right:1rem;border-bottom:1px solid var(--border);}
  .backrow{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;}
  .back-btn{background:var(--dark);color:var(--cream);border:none;width:38px;height:38px;border-radius:12px;font-size:1.1rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .2s;}
  .back-btn:hover{background:var(--gold);color:var(--dark);}
  .backrow h2{font-family:'Playfair Display',serif;font-size:1.35rem;color:var(--dark);display:flex;align-items:center;gap:.45rem;}
  .chips{display:flex;gap:.45rem;overflow-x:auto;padding-bottom:.5rem;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:.42rem .9rem;border-radius:100px;border:1.5px solid var(--border-2);background:var(--card-bg);
    font-size:.82rem;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .18s;}
  .chip:hover{border-color:var(--gold);color:var(--dark);}
  .chip.active{background:var(--dark);border-color:var(--dark);color:var(--cream);}

  /* ---------- ITEM CARDS ---------- */
  .items{display:flex;flex-direction:column;gap:.7rem;}
  .item{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;display:flex;gap:.9rem;padding:.85rem;position:relative;transition:box-shadow .18s,transform .18s;overflow:hidden;}
  .item:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .item.in-cart{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold) inset;}
  .item-img{width:78px;height:78px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,#EFE6D2,#D8C79F);display:flex;align-items:center;justify-content:center;font-size:2rem;filter:drop-shadow(0 2px 4px rgba(26,18,9,.1));}
  .item-body{flex:1;min-width:0;display:flex;flex-direction:column;}
  .item-name{font-family:'Playfair Display',serif;font-size:1.02rem;font-weight:600;color:var(--dark);line-height:1.2;}
  .item-name mark{background:var(--gold-light);color:var(--dark);border-radius:3px;padding:0 1px;}
  .item-desc{font-size:.78rem;color:var(--muted);margin-top:.2rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .item-foot{display:flex;align-items:center;justify-content:space-between;margin-top:.55rem;gap:.5rem;}
  .item-price{font-weight:700;font-size:1.02rem;color:var(--rust);white-space:nowrap;}
  .item-cat-tag{font-size:.68rem;color:var(--muted);font-weight:500;margin-top:.15rem;}
  .add-btn{background:var(--dark);color:var(--cream);border:none;border-radius:10px;padding:.45rem .85rem;font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:background .18s,transform .1s;white-space:nowrap;}
  .add-btn:hover{background:var(--gold);color:var(--dark);}
  .add-btn:active{transform:scale(.94);}
  .qty{display:flex;align-items:center;gap:.5rem;background:var(--cream);border:1.5px solid var(--border-2);border-radius:10px;padding:.2rem;}
  .qty button{width:30px;height:30px;border:none;background:var(--dark);color:var(--cream);border-radius:7px;font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s;}
  .qty button:hover{background:var(--gold);color:var(--dark);}
  .qty span{font-weight:700;min-width:20px;text-align:center;font-size:.95rem;}
  .badge{position:absolute;top:.55rem;right:.55rem;background:var(--gold);color:var(--dark);font-size:.62rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.18rem .48rem;border-radius:5px;box-shadow:var(--shadow-sm);}

  .empty-state{text-align:center;color:var(--muted);padding:3rem 1rem;}
  .empty-state .big{font-size:3rem;margin-bottom:.6rem;}
  .empty-state h3{font-family:'Playfair Display',serif;color:var(--dark);font-size:1.2rem;margin-bottom:.3rem;}
  .search-meta{font-size:.8rem;color:var(--muted);margin:-.3rem 0 .9rem;}

  /* ---------- CART FAB ---------- */
  .fab{position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--cream);border:none;border-radius:100px;
    padding:.95rem 1.4rem;font-family:inherit;font-size:.98rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:.8rem;
    box-shadow:var(--shadow-lg);transition:transform .2s,background .2s,opacity .2s;z-index:100;min-width:min(340px,88vw);justify-content:space-between;}
  .fab:hover{background:var(--gold);color:var(--dark);}
  .fab.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(120%);}
  .fab .fab-left{display:flex;align-items:center;gap:.6rem;}
  .fab .count{background:var(--gold);color:var(--dark);border-radius:100px;min-width:24px;height:24px;padding:0 .4rem;font-size:.82rem;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .fab.hidden .count,.fab:hover .count{background:var(--dark);color:var(--gold);}
  .fab .fab-total{font-weight:800;}

  /* ---------- MODAL / OVERLAY ---------- */
  .overlay{position:fixed;inset:0;background:rgba(26,18,9,.62);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}
  .overlay.open{display:flex;}
  .sheet{background:var(--cream);border-radius:26px 26px 0 0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .32s cubic-bezier(.2,.8,.2,1);}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet-grip{width:40px;height:4px;background:var(--border-2);border-radius:100px;margin:.6rem auto .2rem;flex-shrink:0;}
  .sheet-head{padding:.6rem 1.4rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
  .sheet-head h2{font-family:'Playfair Display',serif;font-size:1.35rem;}
  .x-btn{background:var(--border);border:none;border-radius:50%;width:36px;height:36px;font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
  .x-btn:hover{background:var(--dark);color:var(--cream);}
  .sheet-body{overflow-y:auto;flex:1;padding:1rem 1.4rem;}

  .cart-line{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--border);}
  .cart-line .ce{font-size:1.35rem;}
  .cart-line .cn{flex:1;min-width:0;font-weight:500;font-size:.92rem;line-height:1.2;}
  .cart-line .cn small{display:block;color:var(--muted);font-weight:400;font-size:.78rem;}
  .mini-qty{display:flex;align-items:center;gap:.4rem;}
  .mini-qty button{width:26px;height:26px;border:none;background:var(--cream-2);color:var(--dark);border-radius:6px;font-size:.95rem;cursor:pointer;}
  .mini-qty button:hover{background:var(--gold);}
  .mini-qty span{min-width:18px;text-align:center;font-weight:700;font-size:.88rem;}
  .cart-line .cp{font-weight:700;color:var(--rust);min-width:74px;text-align:right;font-size:.92rem;}

  .field{margin-top:1rem;}
  .field label{display:block;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:.35rem;}
  .field label .req{color:var(--rust);}
  .field input,.field textarea{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border-2);border-radius:10px;font-family:inherit;font-size:.92rem;background:var(--card-bg);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;resize:none;}
  .field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,150,42,.13);}
  .field.two{display:flex;gap:.7rem;}
  .field.two>div{flex:1;}

  .sheet-foot{padding:1rem 1.4rem 1.3rem;border-top:2px solid var(--border);background:var(--card-bg);flex-shrink:0;}
  .foot-total{display:flex;justify-content:space-between;align-items:baseline;font-size:1.05rem;font-weight:700;margin-bottom:.8rem;}
  .foot-total .tv{color:var(--rust);font-size:1.4rem;}
  .cta{width:100%;background:var(--gold);color:var(--dark);border:none;border-radius:13px;padding:1rem;font-family:inherit;font-size:1rem;font-weight:800;letter-spacing:.01em;cursor:pointer;transition:background .2s,transform .1s;display:flex;align-items:center;justify-content:center;gap:.5rem;}
  .cta:hover{background:var(--gold-light);}
  .cta:active{transform:scale(.98);}
  .cta:disabled{background:var(--border-2);color:var(--muted);cursor:not-allowed;}

  /* ---------- TRACKING ---------- */
  .track{padding:1.6rem 1.4rem 2rem;text-align:center;}
  .track .num{font-size:.8rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:600;}
  .track .num b{color:var(--gold);font-size:1.5rem;display:block;margin-top:.2rem;letter-spacing:.06em;}
  .stepper{display:flex;align-items:flex-start;justify-content:space-between;position:relative;margin:1.8rem .5rem 1.4rem;}
  .stepper::before{content:'';position:absolute;top:26px;left:12%;right:12%;height:3px;background:var(--border-2);border-radius:3px;z-index:0;}
  .stepper .prog{content:'';position:absolute;top:26px;left:12%;height:3px;background:var(--green);border-radius:3px;z-index:1;transition:width .5s ease;}
  .step{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:.5rem;width:33%;}
  .step .ic{width:54px;height:54px;border-radius:50%;background:var(--card-bg);border:3px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;transition:all .35s;color:var(--muted);}
  .step .lbl{font-size:.78rem;font-weight:600;color:var(--muted);transition:color .3s;}
  .step.done .ic{background:var(--green);border-color:var(--green);}
  .step.done .lbl{color:var(--green);}
  .step.current .ic{background:var(--gold);border-color:var(--gold);color:var(--dark);animation:pulse 1.6s infinite;}
  .step.current .lbl{color:var(--dark);}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,150,42,.5);}70%{box-shadow:0 0 0 14px rgba(200,150,42,0);}100%{box-shadow:0 0 0 0 rgba(200,150,42,0);}}
  .track-msg{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:1rem;font-size:.9rem;color:var(--text);line-height:1.45;}
  .track-msg b{color:var(--dark);}
  .track-live{display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--green);font-weight:600;margin-top:.7rem;}
  .track-live .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1.2s infinite;}
  @keyframes blink{50%{opacity:.25;}}
  .notify-btn{margin-top:1rem;background:transparent;border:1.5px solid var(--border-2);color:var(--dark);border-radius:12px;padding:.75rem;width:100%;font-family:inherit;font-weight:600;font-size:.88rem;cursor:pointer;transition:all .2s;}
  .notify-btn:hover{border-color:var(--gold);background:var(--card-bg);}
  .notify-btn.on{border-color:var(--green);color:var(--green);}

  .spin{display:inline-block;width:17px;height:17px;border:2px solid rgba(26,18,9,.3);border-top-color:var(--dark);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- TOAST ---------- */
  .toast{position:fixed;top:1rem;left:50%;transform:translate(-50%,-90px);background:var(--dark);color:var(--cream);padding:.8rem 1.3rem;border-radius:12px;font-size:.9rem;z-index:999;opacity:0;transition:all .3s;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;}
  .toast.show{transform:translate(-50%,0);opacity:1;}

  @media(max-width:380px){.item-img{width:66px;height:66px;font-size:1.7rem;}}
</style>
</head>
<body>

<header>
  <div class="brand-mark">✦ Lanchonete &amp; Restaurante ✦</div>
  <h1>Santa Fé</h1>
  <div class="info-row">
    <span class="info-pill">📍 Vila Olímpia</span>
    <span class="info-pill">⏱ <b>30–45 min</b></span>
    <span class="info-pill">Pedido mín. <b>R$ 10</b></span>
  </div>
</header>

<div class="searchbar">
  <div class="search-inner">
    <span class="lupa">🔍</span>
    <input id="searchInput" type="search" autocomplete="off" placeholder="Buscar no cardápio… (ex: picanha, tapioca, suco)">
    <button class="search-clear" id="searchClear" aria-label="Limpar" onclick="clearSearch()">✕</button>
  </div>
</div>

<main id="app"></main>

<button class="fab hidden" id="fab" onclick="openCart()">
  <span class="fab-left">🛒 <span>Ver pedido</span><span class="count" id="fabCount">0</span></span>
  <span class="fab-total" id="fabTotal">R$ 0,00</span>
</button>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <!-- CART / CHECKOUT -->
    <div id="cartView">
      <div class="sheet-head"><h2>🛒 Seu pedido</h2><button class="x-btn" onclick="closeCart()">✕</button></div>
      <div class="sheet-body">
        <div id="cartLines"></div>
        <div class="field two">
          <div>
            <label>Seu nome <span class="req">*</span></label>
            <input id="clientName" maxlength="40" placeholder="Ex: João Silva">
          </div>
          <div>
            <label>Mesa</label>
            <input id="tableNum" type="number" min="1" max="199" placeholder="Nº">
          </div>
        </div>
        <div class="field">
          <label>Observações</label>
          <textarea id="obs" rows="2" placeholder="Sem cebola, ponto da carne, troco para R$ 50…"></textarea>
        </div>
      </div>
      <div class="sheet-foot">
        <div class="foot-total"><span>Total</span><span class="tv" id="cartTotal">R$ 0,00</span></div>
        <button class="cta" id="confirmBtn" onclick="submitOrder()">Enviar pedido para a cozinha →</button>
      </div>
    </div>
    <!-- TRACKING -->
    <div id="trackView" style="display:none">
      <div class="sheet-head"><h2>👨‍🍳 Acompanhe seu pedido</h2><button class="x-btn" onclick="closeCart()">✕</button></div>
      <div class="track">
        <div class="num">Pedido <b id="trackNum">#000</b></div>
        <div class="stepper">
          <div class="prog" id="trackProg" style="width:0"></div>
          <div class="step" id="step-1"><div class="ic">🧾</div><div class="lbl">Recebido</div></div>
          <div class="step" id="step-2"><div class="ic">👨‍🍳</div><div class="lbl">Em preparo</div></div>
          <div class="step" id="step-3"><div class="ic">✅</div><div class="lbl">Pronto</div></div>

let cart={};                 // id -> qty
let view='home';             // 'home' | 'category' | 'search'
let activeCat=null;
let search='';
let orderCounter=Math.floor(Math.random()*90)+10;
let currentOrder=null;       // {id, order_number}
let pollTimer=null;

const $=s=>document.querySelector(s);
const app=$('#app');
const norm=s=>(s||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

// ===== RENDER: dispatch =====
function render(){
  if(search) return renderSearch();
  if(view==='category') return renderCategory();
  return renderHome();
}

function renderHome(){
  view='home';
  const feats=menu.filter(i=>i.badge).slice(0,14);
  let html='';
  if(feats.length){
    html+='<div class="block-title">Destaques da casa<span class="line"></span></div>';
    html+='<div class="featured-scroll">'+feats.map(featCard).join('')+'</div>';
  }
  html+='<div class="block-title">Categorias<span class="line"></span></div>';
  html+='<div class="cat-grid">'+CATEGORIES.map(c=>`
    <button class="cat-card" onclick="openCategory('${c.key}')">
      <div class="cat-ic">${c.emoji}</div>
      <div class="cat-label">${c.label}</div>
      <div class="cat-count">${COUNT[c.key]||0} ${(COUNT[c.key]===1)?'item':'itens'}</div>
    </button>`).join('')+'</div>';
  app.innerHTML=html;
  window.scrollTo({top:0});
}

function renderCategory(){
  view='category';
  const items=menu.filter(i=>i.category===activeCat);
  const meta=CAT_META[activeCat];
  let html='<div class="subbar">';
  html+='<div class="backrow"><button class="back-btn" onclick="goHome()">←</button>'
      +`<h2>${meta.emoji} ${meta.label}</h2></div>`;
  html+='<div class="chips">'+CATEGORIES.map(c=>
    `<button class="chip ${c.key===activeCat?'active':''}" onclick="openCategory('${c.key}')">${c.emoji} ${c.label}</button>`).join('')+'</div>';
  html+='</div>';
  html+='<div class="items">'+items.map(i=>itemCard(i)).join('')+'</div>';
  app.innerHTML=html;
  const ac=app.querySelector('.chip.active'); if(ac) ac.scrollIntoView({inline:'center',block:'nearest'});
  window.scrollTo({top:0});
}

function renderSearch(){
  const q=norm(search);
  const res=menu.filter(i=>norm(i.name).includes(q)||norm(i.desc).includes(q)||norm(CAT_META[i.category].label).includes(q));
  let html='<div class="block-title">Resultados<span class="line"></span></div>';
  html+=`<div class="search-meta">${res.length} ${res.length===1?'item encontrado':'itens encontrados'} para “${escapeHtml(search)}”</div>`;
  if(!res.length){
    html+='<div class="empty-state"><div class="big">🔍</div><h3>Nada encontrado</h3><p>Tente outro termo, como “frango”, “doce” ou “natural”.</p></div>';
  }else{
    html+='<div class="items">'+res.map(i=>itemCard(i,true)).join('')+'</div>';
  }
  app.innerHTML=html;
}

// ===== CARD TEMPLATES =====
function hl(text){ // highlight search term
  if(!search) return escapeHtml(text);
  const q=norm(search); const n=norm(text);
  const idx=n.indexOf(q); if(idx<0) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx))+'<mark>'+escapeHtml(text.slice(idx,idx+q.length))+'</mark>'+escapeHtml(text.slice(idx+q.length));
}
function featCard(i){
  return `<div class="feat-card">
    ${i.badge?`<div class="badge">${i.badge}</div>`:''}
    <div class="feat-emoji">${i.emoji}</div>
    <div class="feat-name">${escapeHtml(i.name)}</div>
    <div class="feat-bottom"><span class="feat-price">${brl(i.price)}</span>
      <button class="add-btn" onclick="add(${i.id})">+</button></div>
  </div>`;
}
function itemCard(i,showCat){
  const q=cart[i.id];
  return `<div class="item ${q?'in-cart':''}" id="it-${i.id}">
    ${i.badge?`<div class="badge">${i.badge}</div>`:''}
    <div class="item-img">${i.emoji}</div>
    <div class="item-body">
      <div>
        <div class="item-name">${search?hl(i.name):escapeHtml(i.name)}</div>
        ${i.desc?`<div class="item-desc">${escapeHtml(i.desc)}</div>`:''}
        ${showCat?`<div class="item-cat-tag">${CAT_META[i.category].emoji} ${CAT_META[i.category].label}</div>`:''}
      </div>
      <div class="item-foot">
        <span class="item-price">${brl(i.price)}</span>
        ${q?`<div class="qty"><button onclick="chg(${i.id},-1)">−</button><span>${q}</span><button onclick="chg(${i.id},1)">+</button></div>`
            :`<button class="add-btn" onclick="add(${i.id})">+ Adicionar</button>`}
      </div>
    </div>
  </div>`;
}

// ===== NAV =====
function openCategory(k){ activeCat=k; search=''; syncSearchInput(); renderCategory(); }
function goHome(){ activeCat=null; renderHome(); }

// ===== SEARCH =====
let searchDebounce=null;
$('#searchInput').addEventListener('input',e=>{
  search=e.target.value.trim();
  $('#searchClear').classList.toggle('show',!!search);
  clearTimeout(searchDebounce);
  searchDebounce=setTimeout(()=>{ search?renderSearch():render(); },140);
});
function clearSearch(){ search=''; $('#searchInput').value=''; $('#searchClear').classList.remove('show'); render(); $('#searchInput').blur(); }
function syncSearchInput(){ $('#searchInput').value=''; $('#searchClear').classList.remove('show'); }

// ===== CART =====
function add(id){ cart[id]=(cart[id]||0)+1; afterCart(); toast(menu.find(i=>i.id===id).name+' adicionado'); }
function chg(id,d){ cart[id]=(cart[id]||0)+d; if(cart[id]<=0) delete cart[id]; afterCart(); }
function afterCart(){ updateFab(); render(); if($('#overlay').classList.contains('open')) renderCartLines(); }
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotal(){ return Object.entries(cart).reduce((s,[id,q])=>s+menu.find(i=>i.id==id).price*q,0); }
function updateFab(){
  const c=cartCount(); const fab=$('#fab');
  fab.classList.toggle('hidden',c===0);
  $('#fabCount').textContent=c; $('#fabTotal').textContent=brl(cartTotal());
}

function openCart(){ if(!cartCount())return; $('#cartView').style.display='block'; $('#trackView').style.display='none'; renderCartLines(); $('#overlay').classList.add('open'); }
function closeCart(){ $('#overlay').classList.remove('open'); }
function overlayClick(e){ if(e.target===$('#overlay')) closeCart(); }
function renderCartLines(){
  const lines=Object.entries(cart);
  $('#cartTotal').textContent=brl(cartTotal());
  if(!lines.length){ $('#cartLines').innerHTML='<div class="empty-state"><div class="big">🛒</div><p>Seu carrinho está vazio</p></div>'; return; }
  $('#cartLines').innerHTML=lines.map(([id,q])=>{
    const i=menu.find(m=>m.id==id);
    return `<div class="cart-line"><span class="ce">${i.emoji}</span>
      <span class="cn">${escapeHtml(i.name)}<small>${brl(i.price)} cada</small></span>
      <span class="mini-qty"><button onclick="chg(${i.id},-1)">−</button><span>${q}</span><button onclick="chg(${i.id},1)">+</button></span>
      <span class="cp">${brl(i.price*q)}</span></div>`;
  }).join('');
}

// ===== SUBMIT ORDER =====
async function sbInsertReturn(row){
  const res=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/orders',{
    method:'POST',
    headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify(row)
  });
  const json=await res.json().catch(()=>null);
  if(!res.ok) throw new Error((json&&(json.message||json.hint))||'HTTP '+res.status);
  return Array.isArray(json)?json[0]:json;
}
async function submitOrder(){
  const name=$('#clientName').value.trim();
  const table=$('#tableNum').value.trim();
  const obs=$('#obs').value.trim();
  if(!name){ toast('⚠️ Digite seu nome'); $('#clientName').focus(); return; }
  if(!cartCount()) return;
  const btn=$('#confirmBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Enviando…';
  const items=Object.entries(cart).map(([id,q])=>{const i=menu.find(m=>m.id==id);return{id:i.id,name:i.name,qty:q,price:i.price};});
  const total=cartTotal(); orderCounter++;
  const order={order_number:orderCounter,client_name:name,table_number:table?parseInt(table):null,items,observations:obs,total,status:'pending',created_at:new Date().toISOString()};
  try{
    if(useSupabase){
      const saved=await sbInsertReturn(order);
      currentOrder={id:saved.id,order_number:saved.order_number||orderCounter};
    }else{
      await new Promise(r=>setTimeout(r,900));
      currentOrder={id:null,order_number:orderCounter};
    }
    openTracking();
  }catch(err){
    console.error(err); toast('❌ Erro ao enviar. Tente de novo.');
    btn.disabled=false; btn.innerHTML='Enviar pedido para a cozinha →';
  }
}

// ===== TRACKING =====
const STEP_BY_STATUS={pending:1,preparing:2,done:3,ready:3};
function openTracking(){
  $('#cartView').style.display='none'; $('#trackView').style.display='block'; $('#overlay').classList.add('open');
  $('#trackNum').textContent='#'+String(currentOrder.order_number).padStart(3,'0');
  setStep('pending');
  cart={}; updateFab();
  // gentle auto-request push (client asked for phone updates); still has manual button
  registerPushClient();
  startPolling();
}
function setStep(status){
  const s=STEP_BY_STATUS[status]||1;
  for(let n=1;n<=3;n++){
    const el=$('#step-'+n); el.classList.remove('done','current');
    if(n<s) el.classList.add('done');
    else if(n===s) el.classList.add(status==='done'?'done':'current');
  }
  $('#trackProg').style.width=(s===1?0:s===2?38:76)+'%';
  const msg={
    pending:'A cozinha <b>recebeu seu pedido</b> e vai começar já já. 🍳',
    preparing:'Seu pedido está <b>sendo preparado</b> pela cozinha. 👨‍🍳',
    done:'🎉 Seu pedido está <b>PRONTO</b>! Bom apetite!',
  };
  $('#trackMsg').innerHTML=msg[status==='ready'?'done':status]||msg.pending;
  if(status==='done'||status==='ready'){ $('#trackLive').style.display='none'; try{navigator.vibrate&&navigator.vibrate([120,60,120]);}catch(e){} }
}
function startPolling(){
  stopPolling();
  if(!useSupabase||!currentOrder.id) return; // demo/no-id: static tracker
  let last='pending';
  pollTimer=setInterval(async()=>{
    try{
      const res=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/orders?select=status,order_number&id=eq.'+currentOrder.id,
        {headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
      if(!res.ok) return;
      const rows=await res.json(); if(!rows||!rows.length) return;
      const st=rows[0].status;
      if(st&&st!==last){ last=st; setStep(st);
        if(st==='preparing') toast('👨‍🍳 Seu pedido entrou em preparo!');
        if(st==='done'||st==='ready') toast('🎉 Pedido pronto!');
      }
      if(st==='done'||st==='ready') stopPolling();
    }catch(e){}
  },4000);
}
function stopPolling(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }
function newOrder(){ stopPolling(); currentOrder=null; closeCart(); $('#clientName').value='';$('#tableNum').value='';$('#obs').value=''; $('#confirmBtn').disabled=false; $('#confirmBtn').innerHTML='Enviar pedido para a cozinha →'; goHome(); }

// ===== TOAST =====
let toastT=null;
function toast(msg){ const t=$('#toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ===== PUSH (client) =====
function urlB64ToUint8Array(b){const p='='.repeat((4-b.length%4)%4);const s=(b+p).replace(/-/g,'+').replace(/_/g,'/');const r=atob(s);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)));}
async function enablePush(){ const ok=await registerPushClient(true); const btn=$('#notifyBtn'); if(ok){btn.classList.add('on');btn.textContent='🔔 Você será avisado no celular';} }
async function registerPushClient(interactive){
  if(!useSupabase||!currentOrder||!currentOrder.id) return false;
  if(!('serviceWorker'in navigator)||!('PushManager'in window)) return false;
  try{
    const reg=await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready;
    if(Notification.permission==='denied') return false;
    if(Notification.permission!=='granted'){ if(!interactive&&Notification.permission==='default') return false; const p=await Notification.requestPermission(); if(p!=='granted') return false; }
    const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8Array(VAPID_PUBLIC_KEY)});
    await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/push_subscriptions',{
      method:'POST',headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({order_id:currentOrder.id,role:'client',subscription:sub.toJSON(),created_at:new Date().toISOString()})
    });
    const btn=$('#notifyBtn'); if(btn){btn.classList.add('on');btn.textContent='🔔 Você será avisado no celular';}
    return true;
  }catch(e){ console.warn('push',e.message); return false; }
}

// ===== INIT =====
render();
updateFab();
</script>
</body>
</html>
